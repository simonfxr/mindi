name: Publish to Maven Central

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# Never cancel an upload in flight or publish the same tag concurrently.
concurrency:
  group: maven-central-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  publish:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: maven-central
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Expected a stable release tag such as v0.2.0' >&2
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          declared_version=$(awk -F= '$1 == "version" { print $2 }' gradle.properties)
          if [[ "$version" != "$declared_version" ]]; then
            echo "Tag version $version does not match gradle.properties version $declared_version" >&2
            exit 1
          fi
          echo "FORCED_VERSION=$version" >> "$GITHUB_ENV"

      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # Keep private signing material out of persistent Gradle caches.
          cache-disabled: true

      - name: Publish signed release and wait for Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for variable in ORG_GRADLE_PROJECT_mavenCentralUsername ORG_GRADLE_PROJECT_mavenCentralPassword ORG_GRADLE_PROJECT_signingInMemoryKey ORG_GRADLE_PROJECT_signingInMemoryKeyPassword; do
            if [[ -z "${!variable}" ]]; then
              echo "Missing required secret: $variable" >&2
              exit 1
            fi
          done
          ./gradlew publishAndReleaseToMavenCentral \
            -PmavenCentralDeploymentValidation=PUBLISHED \
            --no-configuration-cache --no-daemon --max-workers=2
