name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: JVM (Java 8 and 21), JavaScript and Linux x64
            os: ubuntu-24.04
            # Kotlin/Native does not support Linux ARM64 compiler hosts.
            # Cross-compile that artifact here; do not claim to runtime-test it.
            tasks: jvmTest jvmJava21Test jsNodeTest linuxX64Test linuxArm64Klib
          - name: Windows x64
            os: windows-2025
            tasks: mingwX64Test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '21'
          distribution: temurin
      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Run tests
        shell: bash
        env:
          TEST_TASKS: ${{ matrix.tasks }}
        run: |
          read -r -a tasks <<< "$TEST_TASKS"
          ./gradlew "${tasks[@]}" --no-configuration-cache --max-workers=2
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            build/reports/tests/
            build/test-results/
          if-no-files-found: ignore
