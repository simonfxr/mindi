name: Generate and Publish Documentation

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: documentation
  cancel-in-progress: false

jobs:
  build-dokka:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # Preserve the existing gh-pages branch deployment.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '21'
          distribution: temurin
      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Generate documentation
        run: ./gradlew dokkaGeneratePublicationHtml --no-configuration-cache --max-workers=2
      - name: Upload documentation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: documentation
          path: build/dokka/html/
          if-no-files-found: error
      - name: Deploy to GitHub Pages
        if: startsWith(github.ref, 'refs/tags/')
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4
        with:
          folder: build/dokka/html
          branch: gh-pages
          clean: true
